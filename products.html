<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://www.gstatic.com; style-src 'self'; img-src 'self' data: blob:; connect-src 'self' https://*.googleapis.com https://*.firebaseio.com https://*.firebaseapp.com; frame-src https://*.firebaseapp.com; object-src 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>全部商品 | 手作縫紉工作室</title>
<meta name="description" content="瀏覽手作縫紉工作室的現貨手作包、布藝生活小物與接單製作商品，可依關鍵字、分類、狀態與價格排序篩選。">
<meta property="og:title" content="全部商品 | 手作縫紉工作室">
<meta property="og:description" content="查看最新上架的手作布包與布藝生活小物，透過 LINE 確認庫存與購買方式。">
<meta property="og:image" content="baghead.jpg">
<link rel="canonical" href="https://example.com/products.html">
<link rel="icon" href="baghead.jpg">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="navbar-placeholder"></div>

<main class="catalog-page">
  <section class="site-shell page-hero" aria-labelledby="catalogTitle">
    <p class="section-kicker">全部商品</p>
    <h1 id="catalogTitle">手作布包與布藝生活小物</h1>
    <p>每件作品皆以少量製作為主，商品狀態與庫存請以下單前 LINE 確認為準。</p>
  </section>

  <section class="site-shell catalog-section" aria-labelledby="filterTitle">
    <h2 id="filterTitle" class="sr-only">商品篩選</h2>

    <form id="productFilterForm" class="catalog-toolbar">
      <label class="field-group field-group--wide" for="productSearch">
        <span>搜尋商品</span>
        <input id="productSearch" type="search" name="search" placeholder="輸入商品名稱、SKU 或關鍵字" autocomplete="off">
      </label>

      <label class="field-group" for="productCategory">
        <span>商品分類</span>
        <select id="productCategory" name="category">
          <option value="all">全部分類</option>
        </select>
      </label>

      <label class="field-group" for="productStatus">
        <span>商品狀態</span>
        <select id="productStatus" name="status">
          <option value="all">全部狀態</option>
          <option value="in_stock">現貨</option>
          <option value="made_to_order">接單製作</option>
          <option value="sold_out">已售出</option>
        </select>
      </label>

      <label class="field-group" for="productSort">
        <span>排序</span>
        <select id="productSort" name="sort">
          <option value="latest">最新上架</option>
          <option value="price_asc">價格由低至高</option>
          <option value="price_desc">價格由高至低</option>
        </select>
      </label>

      <button id="clearProductFilters" class="btn btn--secondary catalog-toolbar__clear" type="button">清除條件</button>
    </form>

    <div class="catalog-summary" aria-live="polite">
      <p id="productResultCount">顯示 0 件商品</p>
    </div>

    <div id="productStateMessage" class="loading-state" role="status">正在載入商品...</div>
    <div id="productContainer" class="catalog-grid" aria-live="polite"></div>
  </section>
</main>

<div id="footer-placeholder"></div>

<script src="site-config.js"></script>
<script src="navbar.js"></script>
<script src="footer.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="products.js"></script>
</body>
</html>
